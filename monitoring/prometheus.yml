global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'spliteasy-api'
    static_configs:
      # Local development
      - targets: ['host.docker.internal:5000']
    metrics_path: /metrics
    scheme: http

  # For Render.com production — replace with your actual Render URL
  # - job_name: 'spliteasy-api-prod'
  #   static_configs:
  #     - targets: ['your-app.onrender.com']
  #   metrics_path: /metrics
  #   scheme: https
